name: Scheduled Daily Batch Risk Inference

on:
  schedule:
    # Run every day at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  daily-batch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Daily Risk Monitoring Pipeline
        run: |
          python scripts/run_daily_inference.py

      - name: Upload Daily Risk Report
        uses: actions/upload-artifact@v4
        with:
          name: daily-risk-report
          path: results/daily_monitoring/
          retention-days: 30
